Name: Balla
Summary: A chronological, Facebook-inspired Bluesky client
Description: |-
  Balla shows the people you follow on Bluesky, newest first, as cards. No
  ranking, suggested posts or ads.

  Balla is independent software. It is not an official Bluesky client and is not
  affiliated with Meta or Bluesky Social PBC.
